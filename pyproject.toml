[project]
name = "raz"
version = "0.1.0"
description = "Voice interface for Claude Code — kokoro-mlx TTS + mlx-whisper STT on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro-mlx>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sounddevice>=0.5",
    "mlx-whisper>=0.4.3",
    "pynput>=1.7",
    "mcp[cli]>=1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raz"]

[project.scripts]
raz-server = "raz.tts_server:main"
